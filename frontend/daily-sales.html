<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>bManager - Daily Sales</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/daily-sales.css"
    >

</head>


<body>

    <!-- HEADER -->

    <header class="top-bar">

        <div class="brand">

            <img
                src="assets/logo.png"
                alt="bManager logo"
                class="brand-logo"
            >

            <div class="brand-text">

                <h1>bManager</h1>

                <p>Daily Sales Report</p>

            </div>

        </div>


        <div class="header-actions">

            <button
                type="button"
                class="secondary-btn"
                onclick="location.href='index.html'"
            >
                ← Home
            </button>

        </div>

    </header>


    <!-- MAIN -->

    <main class="inventory-container">


        <section class="page-heading">

            <div>

                <h2>Daily Sales</h2>

                <p>
                    Select a date to view the sales
                    report for that business day.
                </p>

            </div>

        </section>


        <!-- DATE PICKER -->

        <section class="sales-date-card">

            <label for="salesDate">
                Select date
            </label>

            <input
                type="date"
                id="salesDate"
            >

            <button
                type="button"
                class="primary-btn"
                id="viewReportBtn"
            >
                View Report
            </button>

        </section>


        <!-- REPORT -->

        <section
            class="inventory-section"
            id="salesReport"
        >

            <div class="section-header">

                <div>

                    <h3 id="reportTitle">
                        Daily Sales Report
                    </h3>

                    <p id="reportDate">
                        Select a date to continue.
                    </p>

                </div>

            </div>


            <div
                class="sales-empty"
                id="salesEmpty"
            >

                <div class="empty-icon">
                    📊
                </div>

                <h3>
                    No report selected
                </h3>

                <p>
                    Choose a date above to view
                    the daily sales report.
                </p>

            </div>


            <!-- REPORT TABLE -->

            <div
                class="table-wrapper"
                id="salesTableWrapper"
                style="display:none;"
            >

                <table id="salesTable">

                    <thead>

                        <tr>

                            <th>#</th>

                            <th>Product</th>

                            <th>Quantity Sold</th>

                            <th>Price</th>

                            <th>Total</th>

                        </tr>

                    </thead>


                    <tbody
                        id="salesTableBody"
                    >
                    </tbody>


                    <tfoot>

                        <tr>

                            <td
                                colspan="2"
                            >
                                TOTAL
                            </td>

                            <td
                                id="salesQuantityTotal"
                            >
                                0
                            </td>

                            <td>
                                —
                            </td>

                            <td
                                id="salesValueTotal"
                            >
                                ₦0.00
                            </td>

                        </tr>

                    </tfoot>

                </table>

            </div>

        </section>


    </main>


    <script
        src="js/app.js"
    ></script>

    <script
        src="js/daily-sales.js"
    ></script>

</body>

</html>
