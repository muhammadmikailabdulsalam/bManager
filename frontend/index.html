
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>bManager</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <!-- =========================================
         bManager HEADER
         ========================================= -->

    <header class="top-bar">

        <div class="brand">

            <img
                src="assets/logo.png"
                alt="bManager logo"
                class="brand-logo"
            >

            <div class="brand-text">

                <h1>bManager</h1>

                <p>Business Management</p>

            </div>

        </div>

        <div class="header-actions">
            <button
                type="button"
                class="secondary-btn"
                id="logoutBtn"
            >
                Logout
            </button>
        </div>

    </header>


    <!-- =========================================
         DASHBOARD
         ========================================= -->

    <main class="dashboard-container">

        <section class="dashboard-heading">

            <h2>Welcome to bManager</h2>

            <p>
                Manage your inventory and view your
                business reports from one place.
            </p>

        </section>


        <!-- =====================================
             DAILY INVENTORY
             ===================================== -->

        <button
            type="button"
            class="dashboard-card"
            onclick="location.href='inventory.html'"
        >

            <div class="dashboard-card-icon">
                📦
            </div>

            <div class="dashboard-card-content">

                <h3>Daily Inventory</h3>

                <p>
                    Manage today's products,
                    new orders and remaining stock.
                </p>

            </div>

            <div class="dashboard-card-arrow">
                →
            </div>

        </button>


        <!-- =====================================
             DAILY SALES
             ===================================== -->

        <button
            type="button"
            class="dashboard-card"
            onclick="location.href='daily-sales.html'"
        >

            <div class="dashboard-card-icon">
                📊
            </div>

            <div class="dashboard-card-content">

                <h3>Daily Sales</h3>

                <p>
                    Select a date and view the
                    daily sales report.
                </p>

            </div>

            <div class="dashboard-card-arrow">
                →
            </div>

        </button>


        <!-- =====================================
             MONTHLY SALES
             ===================================== -->

        <button
            type="button"
            class="dashboard-card"
            onclick="location.href='monthly-sales.html'"
        >

            <div class="dashboard-card-icon">
                📅
            </div>

            <div class="dashboard-card-content">

                <h3>Monthly Sales</h3>

                <p>
                    Select a month and view the
                    monthly sales report.
                </p>

            </div>

            <div class="dashboard-card-arrow">
                →
            </div>

        </button>

    </main>

        <!-- =====================================
             PROFIT CENTER
             ===================================== -->

        <button
            type="button"
            class="dashboard-card"
            onclick="location.href='profit.html'"
        >

            <div class="dashboard-card-icon">
                💰
            </div>

            <div class="dashboard-card-content">

                <h3>Profit Center</h3>

                <p>
                    Enter product unit costs and
                    view your daily and monthly profit.
                </p>

            </div>

            <div class="dashboard-card-arrow">
                →
            </div>

        </button>
    <!-- =========================================
         DASHBOARD STYLES
         ========================================= -->

    <style>

        .dashboard-container {

            width:
                min(
                    900px,
                    calc(100% - 32px)
                );

            margin: 0 auto;

            padding:
                40px 0 60px;

        }


        .dashboard-heading {

            margin-bottom: 28px;

        }


        .dashboard-heading h2 {

            font-size: 32px;

            line-height: 1.15;

            font-weight: 800;

            letter-spacing: -0.8px;

        }


        .dashboard-heading p {

            color: #8b9c78;

            margin-top: 8px;

            max-width: 600px;

        }


        .dashboard-card {

            width: 100%;

            border:
                1px solid #3a4a30;

            border-radius: 18px;

            background: #212b1c;

            color: #eef1e6;

            padding: 22px;

            margin-bottom: 16px;

            display: flex;

            align-items: center;

            gap: 18px;

            text-align: left;

            cursor: pointer;

            box-shadow:
                0 4px 14px
                rgba(0, 0, 0, 0.30);

            transition:
                transform 0.15s ease,
                border-color 0.15s ease,
                box-shadow 0.15s ease;

        }


        .dashboard-card:hover {

            transform:
                translateY(-2px);

            border-color:
                #c2a24d;

            box-shadow:
                0 8px 22px
                rgba(0, 0, 0, 0.42);

        }


        .dashboard-card:active {

            transform:
                scale(0.98);

        }


        .dashboard-card-icon {

            width: 56px;

            height: 56px;

            border-radius: 14px;

            background: #2c3924;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 27px;

            flex-shrink: 0;

        }


        .dashboard-card-content {

            flex: 1;

            min-width: 0;

        }


        .dashboard-card-content h3 {

            font-size: 19px;

            font-weight: 800;

        }


        .dashboard-card-content p {

            color: #8b9c78;

            font-size: 13px;

            margin-top: 4px;

        }


        .dashboard-card-arrow {

            color: #c2a24d;

            font-size: 25px;

            font-weight: 800;

        }


        @media (max-width: 600px) {

            .dashboard-container {

                padding-top: 30px;

            }


            .dashboard-heading h2 {

                font-size: 27px;

            }


            .dashboard-card {

                padding: 18px;

                gap: 14px;

            }


            .dashboard-card-icon {

                width: 50px;

                height: 50px;

                font-size: 24px;

            }


            .dashboard-card-content h3 {

                font-size: 17px;

            }

        }

    </style>


<script src="js/app.js"></script>

</body>

</html>
