<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bManager - Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<main class="login-container">
    <section class="login-card">

        <div class="logo">
            <img src="assets/logo.png" alt="bManager logo" class="auth-logo">
            <h1>bManager</h1>
            <p>Business Management System</p>
        </div>

        <form id="loginForm">

            <div id="messageBox" class="message" aria-live="polite"></div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                        aria-label="Show password"
                        title="Show password"
                    >
                        👁️
                    </button>
                </div>
            </div>

            <button type="submit" id="loginBtn" class="login-btn">
                Login
            </button>
        </form>

        <div class="divider"><span>or</span></div>

        <div id="googleButton" class="google-button-container"></div>

        <p class="auth-switch">
            Don't have an account?
            <a href="register.html">Create an account</a>
        </p>

        <div class="footer-text">
            <p>Secure access to your bManager account</p>
        </div>

    </section>
</main>

<script src="js/login.js"></script>
</body>
</html>
